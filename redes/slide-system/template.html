<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  /* === RESET === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* === BASE === */
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 100px 60px 60px; color: #ffffff; }
  /* === BADGE === */
  .badge { background: rgba(0,122,255,0.15); color: #007aff; font-size: 34px; font-weight: bold; padding: 12px 40px; border-radius: 50px; margin-bottom: 40px; }
  /* === NÚMERO === */
  .number { font-size: 200px; font-weight: bold; line-height: 1; margin-bottom: 30px; }
  /* === TÍTULO === */
  .title { text-align: center; margin-bottom: 40px; }
  .title-line { font-size: 72px; font-weight: bold; line-height: 1.2; margin-bottom: 16px; color: #ffffff; }
  .title-line:last-child { margin-bottom: 0; }
  .title-line.accent { color: #ff3b30; }
  /* === CUERPO === */
  .body { font-size: 40px; color: #aeb4b8; text-align: center; line-height: 1.5; margin-bottom: 20px; max-width: 860px; }
  /* === CTA === */
  .cta-button { background: #007aff; color: #ffffff; font-size: 52px; font-weight: bold; padding: 28px 40px; border-radius: 40px; text-align: center; margin: 20px 0 16px; width: 100%; max-width: 760px; }
  .cta-sub { font-size: 36px; color: #ffffff; text-align: center; }
  /* === FOOTER === */
  .footer { margin-top: auto; font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <!-- BADGE (opcional) -->
  <!-- <div class="badge">CLÍNICAS DENTALES · VERANO MEDIA</div> -->

  <!-- NÚMERO (opcional) -->
  <!-- <div class="number">1</div> -->

  <!-- TÍTULO -->
  <div class="title">
    <div class="title-line">TU TÍTULO AQUÍ</div>
    <div class="title-line accent">SEGUNDA LÍNEA</div>
  </div>

  <!-- CUERPO -->
  <div class="body">Tu texto aquí.</div>

  <!-- CTA (opcional) -->
  <!-- <div class="cta-button">DIAGNÓSTICO GRATUITO</div> -->
  <!-- <div class="cta-sub">Escríbenos 'SISTEMA' por WhatsApp</div> -->

  <!-- FOOTER -->
  <div class="footer">Verano Media · tu sistema de clientes</div>
</body>
</html>
