<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 100px 60px 60px; }
  .badge-top { background: rgba(255,159,10,0.15); color: #ff9f0a; font-size: 32px; font-weight: bold; padding: 10px 30px; border-radius: 50px; margin-bottom: 60px; }
  .title { text-align: center; margin-bottom: 40px; }
  .title-line { font-size: 78px; font-weight: bold; color: #ffffff; line-height: 1.2; margin-bottom: 16px; }
  .title-line:last-child { margin-bottom: 0; }
  .title-line.accent { color: #ff9f0a; }
  .body { font-size: 42px; color: #aeb4b8; text-align: center; line-height: 1.5; margin-bottom: 60px; max-width: 840px; }
  .cta-button { background: #ff9f0a; color: #ffffff; font-size: 56px; font-weight: bold; padding: 32px 48px; border-radius: 40px; text-align: center; margin-bottom: 20px; width: 100%; max-width: 760px; }
  .cta-sub { font-size: 36px; color: #ffffff; text-align: center; margin-bottom: auto; }
  .footer { font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <div class="badge-top">INMOBILIARIAS</div>
  <div class="title">
    <div class="title-line">Un sistema profesional</div>
    <div class="title-line accent">vende tu propiedad.</div>
  </div>
  <div class="body">Catálogo digital + seguimiento automático + CRM inmobiliario.</div>
  <div class="cta-button">DIAGNÓSTICO GRATUITO</div>
  <div class="cta-sub">Escríbenos 'SISTEMA' por WhatsApp</div>
  <div class="footer">Verano Media</div>
</body>
</html>
