<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: #0a0a0c; font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: row; }
  .sidebar { width: 120px; background: #ff9f0a; display: flex; align-items: center; justify-content: center; }
  .sidebar-number { font-size: 180px; font-weight: bold; color: rgba(0,0,0,0.3); line-height: 1; writing-mode: vertical-rl; transform: rotate(180deg); }
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 80px; }
  .title { text-align: center; margin-bottom: 50px; }
  .title-line { font-size: 72px; font-weight: bold; color: #ffffff; line-height: 1.3; margin-bottom: 18px; }
  .body { font-size: 42px; color: #aeb4b8; text-align: center; line-height: 1.5; margin-bottom: 20px; max-width: 840px; }
  .footer { margin-top: auto; font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-number">2</div>
  </div>
  <div class="content">
    <div class="title">
      <div class="title-line">Sin fotos profesionales,</div>
      <div class="title-line">no generas confianza</div>
    </div>
    <div class="body">Un teléfono con fotos borrosas transmite desconfianza.</div>
    <div class="body">Fotos profesionales + descripción clara = ventas.</div>
    <div class="footer">Verano Media</div>
  </div>
</body>
</html>
