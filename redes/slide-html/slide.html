<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 100px 60px 60px; }
  .badge { background: rgba(0,122,255,0.15); color: #007aff; font-size: 34px; font-weight: bold; padding: 12px 40px; border-radius: 50px; margin-bottom: 40px; }
  .number { font-size: 220px; font-weight: bold; color: rgba(255,59,48,0.25); line-height: 1; margin-bottom: 30px; }
  .title { text-align: center; margin-bottom: 40px; }
  .title-line { font-size: 88px; font-weight: bold; color: #ffffff; line-height: 1.2; margin-bottom: 18px; }
  .title-line:last-child { margin-bottom: 0; }
  .title-line.accent { color: #ff3b30; }
  .subtitle { font-size: 40px; color: #aeb4b8; text-align: center; line-height: 1.4; margin-bottom: auto; }
  .cta { width: 100%; max-width: 760px; margin-bottom: 24px; }
  .cta-button { background: #007aff; color: #ffffff; font-size: 52px; font-weight: bold; padding: 28px 40px; border-radius: 40px; text-align: center; margin-bottom: 16px; }
  .cta-sub { font-size: 36px; color: #ffffff; text-align: center; }
  .footer { font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <div class="badge">CLÍNICAS DENTALES · VERANO MEDIA</div>
  <div class="number">1</div>
  <div class="title">
    <div class="title-line">TU CLÍNICA NO PIERDE</div>
    <div class="title-line">PACIENTES.</div>
    <div class="title-line accent">PIERDE TIEMPO.</div>
  </div>
  <div class="subtitle">El problema no es la odontología. Es el sistema.</div>
  <div class="cta">
    <div class="cta-button">DIAGNÓSTICO GRATUITO</div>
    <div class="cta-sub">Escríbenos 'SISTEMA' por WhatsApp</div>
  </div>
  <div class="footer">Verano Media · tu sistema de clientes</div>
</body>
</html>
