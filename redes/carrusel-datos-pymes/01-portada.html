<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 100px 60px 60px; }
  .badge { background: rgba(52,199,89,0.15); color: #34c759; font-size: 34px; font-weight: bold; padding: 12px 40px; border-radius: 50px; margin-bottom: 40px; }
  .number { font-size: 200px; font-weight: bold; color: rgba(52,199,89,0.2); line-height: 1; margin-bottom: 30px; }
  .title { text-align: center; margin-bottom: 40px; }
  .title-line { font-size: 78px; font-weight: bold; color: #ffffff; line-height: 1.2; margin-bottom: 16px; }
  .title-line.accent { color: #34c759; }
  .subtitle { font-size: 40px; color: #aeb4b8; text-align: center; line-height: 1.4; }
</style>
</head>
<body>
  <div class="badge">PYMES DOMINICANAS · VERANO MEDIA</div>
  <div class="number">1</div>
  <div class="title">
    <div class="title-line">EL DATO QUE TU</div>
    <div class="title-line">COMPETENCIA</div>
    <div class="title-line accent">IGNORA.</div>
  </div>
  <div class="subtitle">Datos reales del mercado dominicano.</div>
</body>
</html>
