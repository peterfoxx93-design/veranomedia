<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(135deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: row; align-items: center; padding: 100px 80px; }
  .left { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
  .right { flex: 2; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 60px; }
  .number { font-size: 280px; font-weight: bold; color: rgba(0,122,255,0.2); line-height: 0.9; }
  .title { text-align: left; margin-bottom: 30px; }
  .title-line { font-size: 68px; font-weight: bold; color: #ffffff; line-height: 1.3; margin-bottom: 16px; }
  .body { font-size: 40px; color: #aeb4b8; line-height: 1.5; margin-bottom: 16px; max-width: 600px; }
</style>
</head>
<body>
  <div class="left">
    <div class="number">36,1%</div>
  </div>
  <div class="right">
    <div class="title">
      <div class="title-line">de las PyMEs dominicanas</div>
      <div class="title-line">opera con baja automatizacion</div>
    </div>
    <div class="body">La mayoria sigue haciendo todo a mano.</div>
    <div class="body">Nosotros le entregamos el sistema listo.</div>
  </div>
</body>
</html>
