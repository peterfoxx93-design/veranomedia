<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 120px 60px 60px; position: relative; }
  .title { text-align: center; margin-bottom: 50px; }
  .title-line { font-size: 72px; font-weight: bold; color: #ffffff; line-height: 1.3; margin-bottom: 18px; }
  .body { font-size: 42px; color: #aeb4b8; text-align: center; line-height: 1.5; margin-bottom: 20px; max-width: 840px; }
  .number { position: absolute; bottom: 60px; right: 80px; font-size: 240px; font-weight: bold; color: rgba(52,199,89,0.15); line-height: 1; }
  .footer { position: absolute; bottom: 40px; left: 60px; font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <div class="title">
    <div class="title-line">27,8% de las PyMEs se siente</div>
    <div class="title-line">lista para IA</div>
  </div>
  <div class="body">Tienen la confianza, pero no ejecutan.</div>
  <div class="body">Nosotros le damos la herramienta y el camino.</div>
  <div class="number">27,8%</div>
  <div class="footer">Verano Media</div>
</body>
</html>
