<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(135deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: row; align-items: center; padding: 100px 80px; }
  .left { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
  .right { flex: 2; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 60px; }
  .number { font-size: 280px; font-weight: bold; color: rgba(255,59,48,0.2); line-height: 0.9; }
  .badge { background: rgba(255,59,48,0.15); color: #ff3b30; font-size: 32px; font-weight: bold; padding: 10px 30px; border-radius: 50px; margin-bottom: 30px; }
  .title-line { font-size: 78px; font-weight: bold; color: #ffffff; line-height: 1.2; margin-bottom: 16px; }
  .title-line.accent { color: #ff3b30; }
  .subtitle { font-size: 38px; color: #aeb4b8; line-height: 1.4; margin-top: 20px; }
</style>
</head>
<body>
  <div class="left">
    <div class="number">1</div>
  </div>
  <div class="right">
    <div class="badge">CLÍNICAS DENTALES · VERANO MEDIA</div>
    <div class="title-line">TU CLÍNICA NO PIERDE</div>
    <div class="title-line">PACIENTES.</div>
    <div class="title-line accent">PIERDE TIEMPO.</div>
    <div class="subtitle">El problema no es la odontología. Es el sistema.</div>
  </div>
</body>
</html>
