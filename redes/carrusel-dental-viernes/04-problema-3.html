<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1350">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: linear-gradient(180deg, #0a0a0c 0%, #1c1c1e 100%); font-family: 'DejaVu Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 100px 60px 60px; }
  .number-top { font-size: 40px; font-weight: bold; color: rgba(0,122,255,0.5); letter-spacing: 4px; margin-bottom: 60px; }
  .title { text-align: center; margin-bottom: 50px; }
  .title-line { font-size: 72px; font-weight: bold; color: #ffffff; line-height: 1.3; margin-bottom: 18px; }
  .body { font-size: 42px; color: #aeb4b8; text-align: center; line-height: 1.5; margin-bottom: 20px; max-width: 840px; }
  .footer { margin-top: auto; font-size: 32px; color: #6e7278; }
</style>
</head>
<body>
  <div class="number-top">03</div>
  <div class="title">
    <div class="title-line">Sin fidelizacion,</div>
    <div class="title-line">el paciente no vuelve</div>
  </div>
  <div class="body">Un paciente satisfecho puede traer 3 pacientes nuevos.</div>
  <div class="body">Automatiza recordatorios y seguimientos post-consulta.</div>
  <div class="footer">Verano Media</div>
</body>
</html>
