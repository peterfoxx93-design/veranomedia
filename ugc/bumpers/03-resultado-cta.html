<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #0F1A2E; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
  .metric { font-size: 140px; font-weight: 800; color: #34C759; line-height: 1; margin-bottom: 24px; }
  .label { color: rgba(255,255,255,0.8); font-size: 36px; margin-bottom: 60px; }
  .brand { color: #fff; font-size: 48px; font-weight: 700; margin-bottom: 16px; }
  .cta { background: #0066CC; color: #fff; padding: 28px 56px; border-radius: 9999px; font-size: 36px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="metric">-70%</div>
  <div class="label">no-shows con automatización</div>
  <div class="brand">Verano Media</div>
  <div class="cta">Quiero ese resultado</div>
</body>
</html>
