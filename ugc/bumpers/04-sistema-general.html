<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #0A0A0A; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
  .title { font-size: 64px; font-weight: 800; color: #fff; text-align: center; line-height: 1.2; margin-bottom: 60px; }
  .title span { color: #0066CC; }
  .items { display: flex; gap: 24px; margin-bottom: 60px; }
  .item { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 24px 32px; color: #fff; font-size: 28px; }
  .cta { background: #fff; color: #0A0A0A; padding: 28px 56px; border-radius: 9999px; font-size: 36px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="title">Sistema <span>Verano</span><br>de Captación</div>
  <div class="items">
    <div class="item">Web</div>
    <div class="item">IA</div>
    <div class="item">CRM</div>
    <div class="item">WhatsApp</div>
  </div>
  <div class="cta">Solicitar diagnóstico</div>
</body>
</html>
