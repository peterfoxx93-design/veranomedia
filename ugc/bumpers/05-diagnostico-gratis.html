<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: linear-gradient(180deg, #0A0A0A 0%, #0F1A2E 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
  .badge { background: rgba(52,199,89,0.15); border: 1px solid rgba(52,199,89,0.4); color: #34C759; padding: 16px 32px; border-radius: 9999px; font-size: 28px; font-weight: 600; margin-bottom: 40px; }
  .title { font-size: 72px; font-weight: 800; color: #fff; text-align: center; line-height: 1.1; margin-bottom: 24px; }
  .sub { color: rgba(255,255,255,0.7); font-size: 36px; text-align: center; max-width: 800px; margin-bottom: 60px; }
  .cta { background: #0066CC; color: #fff; padding: 32px 64px; border-radius: 9999px; font-size: 40px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="badge">DIAGNÓSTICO GRATUITO</div>
  <div class="title">20 minutos para saber<br>qué estás perdiendo</div>
  <div class="sub">Sin costo. Sin compromiso. Solo valor real.</div>
  <div class="cta">Reservar ahora</div>
</body>
</html>
